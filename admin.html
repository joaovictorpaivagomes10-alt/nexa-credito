
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b13">
<title>NEXA HUB | Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b13;--panel:#101827;--gold:#d6b46a;--text:#f4f5f7;--muted:#9ba7b8;--line:#263247}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.logo{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 28px}
label{display:block;color:var(--muted);font-size:13px;margin:15px 0 7px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid var(--line);background:#080e19;color:white;outline:none}
input:focus{border-color:var(--gold)}
.btn{width:100%;border:0;border-radius:9px;background:var(--gold);color:#111;font-weight:800;padding:14px;margin-top:20px}
.error{color:#ff8585;font-size:13px;margin-top:14px;line-height:1.5}
.shell{min-height:100vh;display:flex}
.sidebar{width:235px;background:#0d1421;border-right:1px solid var(--line);padding:24px 16px;flex-shrink:0}
.brand{font-size:23px;font-weight:900;letter-spacing:2px;color:var(--gold);padding:8px}
.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:5px}
.nav{margin-top:35px}
.nav button{display:block;width:100%;text-align:left;padding:14px;border:0;background:transparent;color:var(--muted);border-radius:8px;margin:5px 0}
.nav button.active,.nav button:hover{background:#1b2638;color:var(--gold)}
.logout{margin-top:30px!important;color:#ff9b9b!important}
.main{flex:1;min-width:0;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:20px}
.top h1{font-size:23px;margin:0}
.status{font-size:12px;color:#9bd9aa}
.content{padding-top:25px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.metric{font-size:30px;font-weight:800;color:var(--gold);margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.item{padding:15px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.item:last-child{border:0}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#263247;color:#d8c18e;font-size:11px;margin-top:7px}
.refresh{background:#263247;color:white;border:1px solid var(--line);padding:9px 13px;border-radius:8px}
.message{padding:10px;margin:8px 0;border-radius:8px;background:#172235;font-size:13px;overflow-wrap:anywhere}
.message.customer{border-left:3px solid var(--gold)}
.message.seller{border-left:3px solid #7db9e8}
@media(max-width:700px){
.shell{display:block}
.sidebar{width:100%;padding:15px}
.nav{display:flex;overflow-x:auto;margin-top:12px}
.nav button{white-space:nowrap;width:auto;margin:3px}
.logout{margin-top:3px!important}
.main{padding:18px}
.top h1{font-size:19px}
}
</style>
</head>
<body>

<section id="loginScreen" class="login-wrap">
 <div class="login">
  <div class="logo">NEXA</div>
  <div class="sub">CENTRAL ADMINISTRATIVA</div>
  <form id="loginForm">
   <label for="email">E-mail de acesso</label>
   <input id="email" type="email" autocomplete="username" required>
   <label for="password">Senha</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <button class="btn" id="loginButton" type="submit">ENTRAR NO PAINEL</button>
  </form>
  <div id="loginError" class="error"></div>
 </div>
</section>

<section id="app" class="shell hidden">
 <aside class="sidebar">
  <div class="brand">NEXA<small>ADMINISTRAÇÃO</small></div>
  <nav class="nav">
   <button class="active" data-page="overview">Visão geral</button>
   <button data-page="sellers">Vendedores</button>
   <button data-page="systems">Sistemas</button>
   <button data-page="chats">Atendimentos</button>
   <button class="logout" id="logoutButton">Sair da conta</button>
  </nav>
 </aside>
 <main class="main">
  <header class="top">
   <h1 id="pageTitle">Visão geral</h1>
   <span class="status">● CONECTADO</span>
  </header>
  <div class="content" id="pageContent">
   <div class="card">Carregando painel...</div>
  </div>
 </main>
</section>

<script>
const SUPABASE_URL="https://qjujystvdehvolwhtkgw.supabase.co";
const SUPABASE_KEY="sb_publishable_uS0uMa2YNj6VKSKo1FQ_Og_hXQHrFxN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentSession=null;
let currentPage="overview";
let cachedSellers=[];
let cachedSystems=[];
let cachedChats=[];

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function showError(message){
 $("loginError").textContent=message;
}
async function checkAdmin(){
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error||!session)return false;
 currentSession=session;
 const {data:profile,error:profileError}=await supabaseClient
  .from("profiles")
  .select("id,role,active")
  .eq("id",session.user.id)
  .maybeSingle();

 if(profileError){
  showError("Não foi possível verificar seu perfil: "+profileError.message);
  return false;
 }
 if(!profile){
  showError("Seu usuário não possui perfil cadastrado.");
  return false;
 }
 if(profile.role!=="admin"||profile.active!==true){
  showError("Acesso negado. Sua conta precisa estar ativa e ter a função admin.");
  await supabaseClient.auth.signOut();
  return false;
 }
 return true;
}
async function openPanel(){
 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");
 await showPage("overview");
}
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=$("loginButton");
 button.disabled=true;
 button.textContent="VERIFICANDO...";
 showError("");
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  const allowed=await checkAdmin();
  if(!allowed){
   await supabaseClient.auth.signOut();
   return;
  }
  await openPanel();
 }catch(error){
  showError(error.message==="Invalid login credentials"
   ?"E-mail ou senha incorretos."
   :"Não foi possível entrar: "+error.message);
 }finally{
  button.disabled=false;
  button.textContent="ENTRAR NO PAINEL";
 }
});
$("logoutButton").addEventListener("click",async()=>{
 await supabaseClient.auth.signOut();
 currentSession=null;
 $("app").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");
 $("password").value="";
 showError("Você saiu da sua conta.");
});
supabaseClient.auth.onAuthStateChange((event)=>{
 if(event==="SIGNED_OUT"){
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
 }
});
document.querySelectorAll("[data-page]").forEach(button=>{
 button.addEventListener("click",()=>showPage(button.dataset.page));
});
async function showPage(page){
 currentPage=page;
 document.querySelectorAll("[data-page]").forEach(b=>
  b.classList.toggle("active",b.dataset.page===page)
 );
 const titles={overview:"Visão geral",sellers:"Vendedores",systems:"Sistemas",chats:"Atendimentos"};
 $("pageTitle").textContent=titles[page]||"NEXA";
 $("pageContent").innerHTML='<div class="card">Carregando...</div>';
 if(page==="overview")renderOverview();
 if(page==="sellers")await loadSellers();
 if(page==="systems")await loadSystems();
 if(page==="chats")await loadChats();
}
function renderOverview(){
 $("pageContent").innerHTML=`
 <div class="grid">
  <div class="card"><div class="muted">Vendedores carregados</div><div class="metric">${cachedSellers.length}</div></div>
  <div class="card"><div class="muted">Sistemas carregados</div><div class="metric">${cachedSystems.length}</div></div>
  <div class="card"><div class="muted">Atendimentos carregados</div><div class="metric">${cachedChats.length}</div></div>
 </div>
 <div class="card"><h3>Central NEXA</h3><p class="muted">Utilize o menu para consultar vendedores, sistemas e atendimentos.</p></div>`;
}
async function loadSellers(){
 const {data,error}=await supabaseClient.rpc("admin_list_sellers");
 if(error){
  $("pageContent").innerHTML=`<div class="card error">Erro ao carregar vendedores: ${escapeHTML(error.message)}</div>`;
  return;
 }
 cachedSellers=Array.isArray(data)?data:(data?.sellers||[]);
 $("pageContent").innerHTML=`<div class="card"><h3>Equipe de vendedores</h3>
 ${cachedSellers.length?cachedSellers.map(s=>`
 <div class="item"><strong>${escapeHTML(s.full_name||s.name||"Sem nome")}</strong>
 <div class="muted">${escapeHTML(s.email||"")}</div>
 <span class="tag">${escapeHTML(s.role||"vendedor")} · ${s.active===false?"Inativo":"Ativo"}</span></div>`).join(""):'<p class="muted">Nenhum vendedor encontrado.</p>'}
 </div>`;
}
async function loadSystems(){
 const {data,error}=await supabaseClient.rpc("admin_list_systems");
 if(error){
  $("pageContent").innerHTML=`<div class="card error">Erro ao carregar sistemas: ${escapeHTML(error.message)}</div>`;
  return;
 }
 cachedSystems=Array.isArray(data)?data:(data?.systems||[]);
 $("pageContent").innerHTML=`<div class="card"><h3>Sistemas disponíveis</h3>
 ${cachedSystems.length?cachedSystems.map(s=>`
 <div class="item"><strong>${escapeHTML(s.name||s.system_name||s.title||"Sistema")}</strong>
 <p class="muted">${escapeHTML(s.description||s.details||"")}</p>
 <span class="tag">${s.active===false?"Inativo":"Ativo"}</span></div>`).join(""):'<p class="muted">Nenhum sistema encontrado.</p>'}
 </div>`;
}
async function loadChats(){
 const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
 if(sessionError||!session){
  $("pageContent").innerHTML='<div class="card error">Sessão encerrada. Entre novamente.</div>';
  return;
 }
 try{
  const response=await fetch(SUPABASE_URL+"/functions/v1/admin-chat-list",{
   method:"GET",
   headers:{
    "Authorization":"Bearer "+session.access_token,
    "apikey":SUPABASE_KEY
   }
  });
  const result=await response.json();
  if(!response.ok||result.success===false){
   throw new Error(result.error||result.message||"Falha ao consultar atendimentos (HTTP "+response.status+").");
  }
  cachedChats=result.sessions||[];
  const messages=result.messages||[];
  $("pageContent").innerHTML=`<div class="card"><h3>Atendimentos recebidos</h3>
  ${cachedChats.length?cachedChats.map(s=>{
   const related=messages.filter(m=>String(m.session_id)===String(s.id));
   return `<div class="item">
    <strong>${escapeHTML(s.customer_name||"Cliente")}</strong>
    <div class="muted">${escapeHTML(s.protocol||"")} · ${escapeHTML(s.customer_contact||"")}</div>
    <span class="tag">${escapeHTML(s.status||"")}</span>
    <div>${related.map(m=>`<div class="message ${escapeHTML(m.sender_type||"")}"><strong>${escapeHTML(m.sender_type||"")}</strong>: ${escapeHTML(m.message||"")}</div>`).join("")||'<p class="muted">Nenhuma mensagem retornada.</p>'}</div>
   </div>`;
  }).join(""):'<p class="muted">Nenhum atendimento encontrado.</p>'}
  </div>`;
 }catch(error){
  $("pageContent").innerHTML=`<div class="card error">Não foi possível carregar os atendimentos: ${escapeHTML(error.message)}</div>`;
 }
}
(async()=>{
 const allowed=await checkAdmin();
 if(allowed)await openPanel();
})();
</script>
</body>
</html>
