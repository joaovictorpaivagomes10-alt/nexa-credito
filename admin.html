<!-- Seção de Atendimento do Operador / Vendedor -->
<div class="space-y-6 text-slate-100">
    
    <!-- Barra de Status do Atendente -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
        <div>
            <h3 class="text-base font-bold text-emerald-400">Painel do Especialista / Atendente</h3>
            <p class="text-xs text-slate-400">Gerencie a fila de triagem e atenda os clientes vindos do assistente virtual.</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="attendant-badge" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300 font-medium">Status: Offline</span>
            <button onclick="toggleAttendantStatus()" id="btn-status" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-xl font-medium transition shadow-md">Ficar Disponível</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Coluna da Esquerda: Fila de Espera -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col h-[520px]">
            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-400 mb-4 flex justify-between items-center">
                <span>Fila de Espera</span>
                <span id="queue-count" class="bg-slate-800 text-emerald-400 px-2 py-0.5 rounded-full text-[10px]">0 aguardando</span>
            </h4>
            <div id="queue-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                <div class="text-center text-xs text-slate-500 my-auto py-10">Nenhum cliente na fila no momento.</div>
            </div>
            <button onclick="callNextTicket()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition text-xs shadow-lg flex items-center justify-center gap-2">
                📢 Chamar Próximo da Fila
            </button>
        </div>

        <!-- Coluna da Direita: Chat Ativo com o Cliente -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col h-[520px] overflow-hidden">
            <div class="p-4 bg-slate-950/60 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h4 id="active-client-name" class="font-bold text-sm text-slate-100">Nenhum cliente selecionado</h4>
                    <p id="active-client-service" class="text-[10px] text-slate-400">Aguardando chamada...</p>
                </div>
                <button onclick="finishTicket()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg transition">Finalizar Atendimento</button>
            </div>

            <!-- Mensagens do Chat Admin -->
            <div id="admin-messages" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col bg-slate-950/30">
                <div class="text-center text-xs text-slate-500 my-auto">Selecione ou chame um cliente para iniciar o chat.</div>
            </div>

            <!-- Input do Atendente -->
            <form id="admin-chat-form" onsubmit="sendAdminMessage(event)" class="p-3 bg-slate-950 border-t border-slate-800 flex gap-2">
                <input type="text" id="admin-msg-input" disabled placeholder="Chame um cliente para começar..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 disabled:opacity-50">
                <button type="submit" id="admin-send-btn" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-medium text-xs transition shadow-md disabled:opacity-50">Responder</button>
            </form>
        </div>

    </div>
</div>

<script>
    let isOnline = false;
    let activeTicket = null;

    function toggleAttendantStatus() {
        isOnline = !isOnline;
        const badge = document.getElementById('attendant-badge');
        const btn = document.getElementById('btn-status');

        if(isOnline) {
            badge.innerText = 'Status: Disponível';
            badge.className = 'text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 font-medium';
            btn.innerText = 'Ficar Offline';
            btn.className = 'bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-medium transition';
            loadQueue();
        } else {
            badge.innerText = 'Status: Offline';
            badge.className = 'text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300 font-medium';
            btn.innerText = 'Ficar Disponível';
            btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-xl font-medium transition';
        }
    }

    async function loadQueue() {
        try {
            const { data, error } = await supabase
                .from('queue_tickets')
                .select('*')
                .eq('status', 'aguardando')
                .order('created_at', { ascending: true });

            if(error) throw error;

            const listContainer = document.getElementById('queue-list');
            document.getElementById('queue-count').innerText = `${data.length} aguardando`;

            if(data.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-xs text-slate-500 my-auto py-10">Nenhum cliente na fila no momento.</div>`;
                return;
            }

            listContainer.innerHTML = data.map(t => `
                <div class="p-3 bg-slate-950/70 border border-slate-800 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-xs font-bold text-emerald-400">${t.ticket_number}</span>
                        <h5 class="text-xs font-semibold text-slate-200">${t.client_name}</h5>
                        <p class="text-[10px] text-slate-400">${t.service_type}</p>
                    </div>
                    <button onclick="callSpecificTicket('${t.id}')" class="text-[10px] bg-slate-800 hover:bg-emerald-600 text-slate-200 px-3 py-1.5 rounded-lg transition">Atender</button>
                </div>
            `).join('');
        } catch(err) {
            console.error('Erro ao carregar fila:', err);
        }
    }

    async function callNextTicket() {
        if(!isOnline) {
            alert('Você precisa estar com o status "Disponível".');
            return;
        }

        try {
            const { data, error } = await supabase
                .from('queue_tickets')
                .select('*')
                .eq('status', 'aguardando')
                .order('created_at', { ascending: true })
                .limit(1)
                .single();

            if(error || !data) {
                alert('A fila está vazia.');
                return;
            }

            setActiveTicket(data);
        } catch(err) {
            console.error('Erro ao chamar próximo:', err);
        }
    }

    async function callSpecificTicket(ticketId) {
        try {
            const { data, error } = await supabase
                .from('queue_tickets')
                .select('*')
                .eq('id', ticketId)
                .single();

            if(error) throw error;
            setActiveTicket(data);
        } catch(err) {
            console.error('Erro ao selecionar ticket:', err);
        }
    }

    async function setActiveTicket(ticket) {
        activeTicket = ticket;

        await supabase
            .from('queue_tickets')
            .update({ status: 'em_atendimento' })
            .eq('id', ticket.id);

        document.getElementById('active-client-name').innerText = `${ticket.ticket_number} - ${ticket.client_name}`;
        document.getElementById('active-client-service').innerText = `Serviço: ${ticket.service_type} | Fone: ${ticket.client_phone}`;
        document.getElementById('admin-msg-input').disabled = false;
        document.getElementById('admin-send-btn').disabled = false;

        loadAdminMessages(ticket.id);
        setupAdminRealtime(ticket.id);
        loadQueue();
    }

    async function loadAdminMessages(ticketId) {
        try {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .eq('ticket_id', ticketId)
                .order('created_at', { ascending: true });

            if(error) throw error;

            const container = document.getElementById('admin-messages');
            container.innerHTML = data.length === 0 ? `<div class="text-center text-xs text-slate-500 my-auto">Inicie a conversa com o cliente.</div>` : '';

            data.forEach(m => appendAdminMsgUI(m.sender, m.message));
        } catch(err) {
            console.error('Erro ao carregar mensagens:', err);
        }
    }

    async function sendAdminMessage(event) {
        event.preventDefault();
        const input = document.getElementById('admin-msg-input');
        const text = input.value.trim();
        if(!text || !activeTicket) return;

        try {
            await supabase.from('messages').insert([
                { ticket_id: activeTicket.id, sender: 'admin', message: text }
            ]);

            appendAdminMsgUI('admin', text);
            input.value = '';
        } catch(err) {
            console.error('Erro ao enviar:', err);
        }
    }

    function appendAdminMsgUI(sender, text) {
        const container = document.getElementById('admin-messages');
        const isAdmin = sender === 'admin';

        container.innerHTML += `
            <div class="flex items-end gap-2 max-w-md ${isAdmin ? 'ml-auto flex-row-reverse' : ''}">
                <div class="w-7 h-7 rounded-full ${isAdmin ? 'bg-blue-600' : 'bg-emerald-600'} flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0">
                    ${isAdmin ? 'EU' : 'CLI'}
                </div>
                <div class="${isAdmin ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-slate-800 text-slate-200 rounded-bl-sm'} p-3 rounded-2xl text-xs leading-relaxed shadow-sm">
                    ${text}
                </div>
            </div>
        `;
        container.scrollTop = container.scrollHeight;
    }

    async function finishTicket() {
        if(!activeTicket) return;

        try {
            await supabase
                .from('queue_tickets')
                .update({ status: 'finalizado' })
                .eq('id', activeTicket.id);

            alert('Atendimento finalizado com sucesso!');
            activeTicket = null;
            document.getElementById('active-client-name').innerText = 'Nenhum cliente selecionado';
            document.getElementById('active-client-service').innerText = 'Aguardando chamada...';
            document.getElementById('admin-messages').innerHTML = `<div class="text-center text-xs text-slate-500 my-auto">Atendimento concluído.</div>`;
            document.getElementById('admin-msg-input').disabled = true;
            document.getElementById('admin-send-btn').disabled = true;
            loadQueue();
        } catch(err) {
            console.error('Erro ao finalizar:', err);
        }
    }

    function setupAdminRealtime(ticketId) {
        supabase
            .channel(`admin-ticket-${ticketId}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `ticket_id=eq.${ticketId}` }, payload => {
                if(payload.new.sender === 'client') {
                    appendAdminMsgUI('client', payload.new.message);
                }
            })
            .subscribe();
    }
</script>
