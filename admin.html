
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b13">
<title>NEXA | Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b13;color:#fff;font-family:Arial,sans-serif}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#111a29;border:1px solid #263247;border-radius:15px;padding:23px}
.login .card{width:100%;max-width:390px}
.logo{text-align:center;color:#d6b46a;font-size:30px;font-weight:900;letter-spacing:4px}
.sub{text-align:center;color:#9ba7b8;font-size:11px;margin:8px 0 25px}
label{display:block;color:#d6b46a;font-size:13px;margin:16px 0 7px}
input{width:100%;padding:14px;background:#080e19;border:1px solid #344158;border-radius:8px;color:white}
button{padding:12px 15px;border:0;border-radius:8px;background:#d6b46a;color:#111;font-weight:bold;cursor:pointer}
.primary{width:100%;margin-top:20px}
.error{color:#ff9999;font-size:13px;margin-top:14px}
.layout{min-height:100vh}
header{padding:18px 22px;background:#101827;border-bottom:1px solid #263247;display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{color:#d6b46a;font-size:21px;letter-spacing:3px}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:23px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.actions button{background:#263247;color:white}
.actions button.active{background:#d6b46a;color:#111}
.item{border-bottom:1px solid #263247;padding:16px 0}
.item:last-child{border:0}
.muted{color:#9ba7b8;font-size:13px;line-height:1.6}
.tag{display:inline-block;background:#263247;color:#d6b46a;padding:5px 9px;border-radius:20px;font-size:11px;margin:8px 0}
.message{background:#172438;padding:12px;border-radius:9px;margin:8px 0;font-size:13px;overflow-wrap:anywhere}
#content{min-height:150px}
</style>
</head>
<body>

<section id="login" class="login">
 <div class="card">
  <div class="logo">NEXA</div>
  <div class="sub">PAINEL ADMINISTRATIVO</div>
  <form id="loginForm">
   <label>E-mail</label>
   <input id="email" type="email" autocomplete="username" required>
   <label>Senha</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <button id="loginButton" class="primary">ENTRAR</button>
  </form>
  <div id="error" class="error"></div>
 </div>
</section>

<section id="panel" class="layout hidden">
 <header>
  <strong>NEXA ADMIN</strong>
  <button id="logout">SAIR</button>
 </header>
 <main>
  <h1>Central de atendimentos</h1>
  <p class="muted">Gerenciamento dos atendimentos recebidos.</p>
  <div class="actions">
   <button id="refresh" class="active">ATUALIZAR</button>
  </div>
  <div id="content" class="card">Carregando...</div>
 </main>
</section>

<script>
const URL="https://qjujystvdehvolwhtkgw.supabase.co";
const KEY="sb_publishable_uS0uMa2YNj6VKSKo1FQ_Og_hXQHrFxN";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let busy=false;

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function isAdmin(){
 const {data:{session},error}=await db.auth.getSession();
 if(error||!session)return false;

 const {data:profile,error:profileError}=await db
  .from("profiles")
  .select("role,active")
  .eq("id",session.user.id)
  .maybeSingle();

 if(profileError){
  $("error").textContent="Erro ao verificar perfil: "+profileError.message;
  return false;
 }
 if(!profile||profile.role!=="admin"||profile.active!==true){
  $("error").textContent="Conta sem permissão de administrador ativa.";
  await db.auth.signOut();
  return false;
 }
 return true;
}

async function enter(){
 $("error").textContent="";
 const button=$("loginButton");
 button.disabled=true;
 button.textContent="VERIFICANDO...";
 try{
  const {error}=await db.auth.signInWithPassword({
   email:$("email").value.trim(),
   password:$("password").value
  });
  if(error)throw error;

  if(!await isAdmin()){
   await db.auth.signOut();
   return;
  }

  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  await loadChats();
 }catch(e){
  $("error").textContent=e.message==="Invalid login credentials"
   ?"E-mail ou senha incorretos."
   :"Erro: "+e.message;
 }finally{
  button.disabled=false;
  button.textContent="ENTRAR";
 }
}

$("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 enter();
});

async function loadChats(){
 if(busy)return;
 busy=true;
 $("content").innerHTML="Buscando atendimentos...";
 $("refresh").disabled=true;
 try{
  const {data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError||!session)throw new Error("Sessão não encontrada.");

  const response=await fetch(URL+"/functions/v1/admin-chat-list",{
   method:"GET",
   headers:{
    "Authorization":"Bearer "+session.access_token,
    "apikey":KEY
   }
  });
  const data=await response.json();

  if(!response.ok||data.success===false){
   throw new Error(data.error||data.message||"Erro HTTP "+response.status);
  }

  const sessions=data.sessions||[];
  const messages=data.messages||[];

  if(!sessions.length){
   $("content").innerHTML='<p class="muted">Nenhum atendimento encontrado.</p>';
   return;
  }

  $("content").innerHTML=sessions.map(s=>{
   const related=messages.filter(m=>String(m.session_id)===String(s.id));
   return `
    <div class="item">
     <strong>${esc(s.customer_name||"Cliente")}</strong>
     <div class="muted">${esc(s.customer_contact||"")}</div>
     <div class="muted">Protocolo: ${esc(s.protocol||"Não informado")}</div>
     <span class="tag">${esc(s.status||"")}</span>
     <p class="muted">Assunto: ${esc(s.subject||"")}</p>
     ${related.map(m=>`
      <div class="message">
       <strong>${esc(m.sender_type||"")}</strong><br>
       ${esc(m.message||"")}
      </div>`).join("")}
    </div>`;
  }).join("");

 }catch(e){
  $("content").innerHTML='<p class="error">Erro ao carregar: '+esc(e.message)+'</p>';
 }finally{
  busy=false;
  $("refresh").disabled=false;
 }
}

$("refresh").addEventListener("click",loadChats);

$("logout").addEventListener("click",async()=>{
 await db.auth.signOut();
 $("panel").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("password").value="";
});

(async()=>{
 if(await isAdmin()){
  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  await loadChats();
 }
})();
</script>
</body>
</html>
